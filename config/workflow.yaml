# 全局设置
max_retry: 2
enable_codegen: false

# 节点定义
nodes:
  - id: req
    agent: RequirementAgent
    next: design
  - id: design
    agent: DesignAgent
    next: review
  - id: review
    agent: ReviewAgent
    next: END
    on_fail: design        # 如果审查未通过，回退到 design
  - id: codegen
    agent: CodeGenAgent
    enabled: false         # 预留节点，默认关闭
    next: END